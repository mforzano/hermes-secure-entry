name: secure-entry
version: 0.5.15+topics.1
description: Private DM login/card entry and native OTP/list/unlock bridge, including authorized Telegram topics with requester-only DM link delivery. Standalone entry and payment tools remain DM-only. In-process only; native consent for Link or saved-card fill, with explicit saved-card cleanup.
license: MIT
requires_hermes: ">=0.22.1,<0.22.6"
provides_tools:
  - secure_entry_card_fill
  - secure_entry_card_remove
  - secure_entry_payment_fill
  - secure_entry_request
  - secure_entry_status
  - secure_entry_cancel
provides_middleware:
  - tool_execution
provides_hooks:
  - agent_loop_stopped
  - on_session_end
  - on_session_reset
python_dependencies: []
capabilities: []
tags: [security, vault, photon, discord, telegram, windows, accessibility]
config_schema:
  link_cli_command:
    type: list
    default: []
    description: Trusted absolute executable argv prefix for local Link CLI; empty disables Link retrieval, not saved-card fill. Use native node.exe plus absolute CLI entrypoint, never cmd/bat or shell commands. Review the CLI before activation.
  public_base_url:
    type: str
    default: https://example.invalid:9443
    description: Trusted Tailscale Serve HTTPS origin; use a dedicated port. Never use Funnel.
  port:
    type: int
    default: 8769
    description: IPv4 loopback listener port. Host is fixed at 127.0.0.1.
