name: secure-entry
version: 0.5.11
description: Private DM login/card entry and native OTP/unlock bridge, plus retained-browser Link or site-bound real-card fill and explicit verified card cleanup. In-process only; real-card route synthetic-tested, not live verified.
license: MIT
requires_hermes: ">=0.22.1,<0.22.2"
provides_tools:
  - secure_entry_card_fill
  - secure_entry_card_remove
  - secure_entry_payment_fill
  - secure_entry_request
  - secure_entry_status
  - secure_entry_cancel
provides_middleware:
  - tool_execution
provides_hooks:
  - agent_loop_stopped
  - on_session_end
  - on_session_reset
python_dependencies: []
capabilities: []
tags: [security, vault, photon, discord, telegram, windows, accessibility]
config_schema:
  link_cli_command:
    type: list
    default: []
    description: Trusted absolute executable argv prefix for local Link CLI; empty disables payment. Use native node.exe plus absolute CLI entrypoint, never cmd/bat or shell commands. No live activation until reviewed.
  public_base_url:
    type: str
    default: https://example.invalid:9443
    description: Trusted Tailscale Serve HTTPS origin; use a dedicated port. Never use Funnel.
  port:
    type: int
    default: 8769
    description: IPv4 loopback listener port. Host is fixed at 127.0.0.1.
